[project]
name = "ttb-cola-search"
version = "0.1.0"
description = "Search the TTB Public COLA Registry"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "azure-identity>=1.25.3",
    "azure-monitor-opentelemetry>=1.8.9",
    "azure-monitor-query>=2.0.0",
    "azure-storage-blob>=12.30.0",
    "certifi>=2026.7.22",
    "fastapi>=0.141.1",
    "google-genai>=2.16.0",
    "numpy>=2.5.1",
    "opentelemetry-instrumentation-psycopg>=0.64b0",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pylance>=9.0.0",
    "pypdf>=6.16.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
